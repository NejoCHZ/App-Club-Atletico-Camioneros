<div class="cacc-layout">
  <!-- Left Sidebar (Verde Institucional CACC) -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <!-- CACC Logo Shield Emblem -->
      <div class="logo-wrapper">
        <img src="cacc-logo.png" alt="Escudo CACC" class="cacc-shield-img" />
      </div>
      <h2 class="club-title">CLUB ATLETICO SOCIAL Y DEPORTIVO CAMIONEROS</h2>
      <p class="club-subtitle">Sistema de Gestión Integral</p>
    </div>

    <!-- Navigation Menu -->
    <nav class="sidebar-nav">
      <a *ngFor="let item of navItems" class="nav-item" [class.active]="item.active" (click)="selectNav(item.label)">
        <span class="nav-icon" [ngSwitch]="item.icon">
          <svg *ngSwitchCase="'home'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <svg *ngSwitchCase="'group'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <svg *ngSwitchCase="'badge'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.2">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
          <svg *ngSwitchCase="'category'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.2">
            <circle cx="12" cy="5" r="3"></circle>
            <circle cx="5" cy="19" r="3"></circle>
            <circle cx="19" cy="19" r="3"></circle>
            <line x1="8.5" y1="16.5" x2="10.5" y2="7.5"></line>
            <line x1="15.5" y1="16.5" x2="13.5" y2="7.5"></line>
          </svg>
        </span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </nav>

    <!-- Logout at Bottom -->
    <div class="sidebar-footer">
      <a class="logout-btn" (click)="cancelar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Cerrar Sesión</span>
      </a>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="main-wrapper">
    <!-- Header Superior -->
    <header class="top-header">
      <div class="header-left">
        <h1 class="header-title">Panel Texto Ejemplo</h1>
      </div>

      <div class="header-right">
        <div class="admin-profile">
          <div class="profile-avatar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
            </svg>
          </div>
          <div class="profile-info">
            <span class="profile-name">Nombre Usuario</span>
            <span class="profile-email">ejemplo@myejemplo.com</span>
          </div>
          <span class="chevron-down">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
        </div>
      </div>
    </header>

    <!-- Main View Body -->
    <main class="content-body">
      <!-- Centered Staff Profile Card Form -->
      <section class="staff-centered-card">
        <!-- Photo Banner Box -->
        <div class="photo-banner">
          <svg width="72" height="72" viewBox="0 0 24 24" fill="#007A3D">
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
          </svg>
        </div>

        <!-- Form Top Section: Nombre y Apellido + Rol -->
        <div class="card-form-header">
          <div class="form-group-block">
            <label class="form-field-label">Nombre y Apellido</label>
            <input type="text" placeholder="Ingrese nombre y apellido" [(ngModel)]="nombreCompleto"
              class="field-input" />
          </div>

          <div class="form-group-block">
            <label class="form-field-label">Rol</label>
            <div class="select-wrapper">
              <select [(ngModel)]="rol" class="field-select">
                <option value="">Seleccione rol</option>
                <option value="DIRECTOR TÉCNICO">Director Técnico</option>
                <option value="PREPARADOR FÍSICO">Preparador Físico</option>
                <option value="MÉDICO">Médico</option>
              </select>
              <span class="select-chevron">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2.5">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </span>
            </div>
          </div>
        </div>

        <hr class="card-divider" />

        <!-- DATOS PERSONALES Section -->
        <div class="personal-data-section">
          <h3 class="section-subtitle">DATOS PERSONALES</h3>

          <div class="personal-data-grid">
            <div class="data-item">
              <div class="data-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#007A3D"
                  stroke-width="2">
                  <path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"></path>
                  <path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"></path>
                  <path d="M2 21h20"></path>
                  <path d="M7 8v-2"></path>
                  <path d="M12 8v-2"></path>
                  <path d="M17 8v-2"></path>
                </svg></div>
              <div class="data-label-group">
                <span class="data-label">Fecha de nacimiento</span>
                <input type="text" placeholder="DD/MM/AAAA" [(ngModel)]="fechaNacimiento" class="sm-input" />
              </div>
            </div>

            <div class="data-item">
              <div class="data-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#007A3D"
                  stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg></div>
              <div class="data-label-group">
                <span class="data-label">Edad</span>
                <input type="text" placeholder="Ingrese edad" [(ngModel)]="edad" class="sm-input" />
              </div>
            </div>

            <div class="data-item">
              <div class="data-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#007A3D"
                  stroke-width="2">
                  <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                </svg></div>
              <div class="data-label-group">
                <span class="data-label">Grupo sanguineo</span>
                <div class="select-wrapper-sm">
                  <select [(ngModel)]="grupoSanguineo" class="sm-select">
                    <option value="">Seleccione</option>
                    <option value="0 +">0 +</option>
                    <option value="0 -">0 -</option>
                  </select>
                  <span class="select-chevron-sm">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2.5">
                      <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                  </span>
                </div>
              </div>
            </div>

            <div class="data-item">
              <div class="data-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#007A3D"
                  stroke-width="2">
                  <path
                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                  </path>
                </svg></div>
              <div class="data-label-group">
                <span class="data-label">Telefono tutor</span>
                <input type="text" placeholder="Ingrese nro celular" [(ngModel)]="telefonoTutor" class="sm-input" />
              </div>
            </div>
          </div>

          <div class="domicilio-box">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#007A3D" stroke-width="2.5">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            <div class="data-label-group flex-fill">
              <span class="data-label">Domicilio</span>
              <input type="text" placeholder="Ingrese domicilio" [(ngModel)]="domicilio" class="sm-input" />
            </div>
          </div>
        </div>
      </section>

      <!-- Bottom Actions Footer Row -->
      <footer class="bottom-actions-row">
        <div class="right-actions-group">
          <button class="btn-cancelar-outline" (click)="cancelar()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            <span>Cancelar</span>
          </button>

          <button class="btn-solid-green" (click)="guardar()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            <span>Guardar</span>
          </button>
        </div>
      </footer>
    </main>
  </div>
</div>
