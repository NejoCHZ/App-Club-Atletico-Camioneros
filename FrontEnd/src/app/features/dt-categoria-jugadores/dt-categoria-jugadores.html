<div class="content-body">
      <h1 class="page-section-title">{{ nombreCategoria }}</h1>

      <!-- Filter Controls Bar Card -->
      <section class="filter-bar-card">
        <div class="filter-left-group">
          <span class="filter-label">Filtrar por posición:</span>
          <div class="filter-pills-row">
            <button class="filter-pill-btn" [class.active]="posicionFiltro === 'Arqueros'" (click)="togglePosicion('Arqueros')">
              <span class="position-filter-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 20V5h16v15M4 8h16"></path><circle cx="12" cy="14" r="3"></circle><path d="m10.2 11.6-1.7-1.4M13.8 11.6l1.7-1.4"></path></svg></span>
              <span>Arqueros</span>
            </button>
            <button class="filter-pill-btn" [class.active]="posicionFiltro === 'Defensores'" (click)="togglePosicion('Defensores')">
              <span class="position-filter-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg></span>
              <span>Defensores</span>
            </button>
            <button class="filter-pill-btn" [class.active]="posicionFiltro === 'Volantes'" (click)="togglePosicion('Volantes')">
              <span class="position-filter-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="5" width="18" height="14" rx="1"></rect><path d="M12 5v14"></path><circle cx="12" cy="12" r="3"></circle></svg></span>
              <span>Volantes</span>
            </button>
            <button class="filter-pill-btn" [class.active]="posicionFiltro === 'Delanteros'" (click)="togglePosicion('Delanteros')">
              <span class="position-filter-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle><path d="M12 1v4M12 19v4M1 12h4M19 12h4"></path></svg></span>
              <span>Delanteros</span>
            </button>
          </div>
        </div>

        <div class="search-input-box">
          <input type="text" placeholder="Buscar por nombre" [(ngModel)]="searchTerm" class="search-input" />
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#007A3D" stroke-width="2.5" class="search-icon-green"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
      </section>

      <!-- Player List Main Container Card -->
      <section class="list-card">
        <h2 class="list-card-title">LISTA DE JUGADORES</h2>

        <div class="players-list-wrapper">
          <div class="player-item-row" *ngFor="let p of filteredPlayers">
            <!-- Left Avatar Double Ring -->
            <div class="player-avatar-ring">
              <div class="player-avatar-circle">
                <span width="24" height="24" viewBox="0 0 24 24" fill="#ffffff" class="cacc-icon cacc-icon-profile"></span>
              </div>
            </div>

            <!-- Player Info Columns -->
            <div class="col-info col-name">{{ p.nombreCompleto }}</div>
            <div class="col-info col-dni">DNI: {{ p.dni }}</div>
            <div class="col-info col-category">{{ p.categoria }}</div>
            <div class="col-info col-pos">
              <span class="position-badge">{{ positionLabel(p.posicion) }}</span>
            </div>
            <div class="col-info col-edad">
              <span class="age-value">{{ p.edad }}</span>
              <span class="birth-value">{{ p.fechaNacimiento }}</span>
            </div>

            <!-- Action Button -->
            <div class="col-info col-actions">
              <button class="btn-action-outline" type="button" (click)="verFicha(p.id)" aria-label="Ver ficha de {{ p.nombreCompleto }}" title="Ver ficha">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <span class="action-label">Ver ficha</span>
              </button>
            </div>
          </div>

          <div *ngIf="filteredPlayers.length === 0" class="no-results">
            No se encontraron jugadores para esta categoría con los criterios seleccionados.
          </div>
        </div>
      </section>
    </div>
