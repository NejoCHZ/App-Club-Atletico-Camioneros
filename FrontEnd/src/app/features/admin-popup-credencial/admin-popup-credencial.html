<div class="popup-backdrop" *ngIf="isVisible" (click)="onCancelar()">
  <div class="popup-modal" (click)="$event.stopPropagation()">
    <!-- Top Header Row -->
    <div class="popup-header">
      <div class="header-icon-badge">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#007A3D" stroke-width="2.5">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>
      <div class="header-text">
        <h2 class="popup-title">Generar credencial</h2>
        <p class="popup-subtitle">Confirmacion previa a la exportacion</p>
      </div>
    </div>

    <!-- Horizontal Divider -->
    <hr class="popup-divider" />

    <!-- Body Content -->
    <div class="popup-body">
      <p class="question-text">¿Deseas generar la credencial con los siguientes datos?</p>

      <div class="data-included-header">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#007A3D" stroke-width="2.5" class="check-icon">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span class="data-included-title">Datos incluidos</span>
      </div>

      <div class="data-items-grid">
        <div class="data-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span class="data-val">{{ nombre }}</span>
        </div>

        <div class="data-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2">
            <rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect><line x1="7" y1="8" x2="17" y2="8"></line><line x1="7" y1="12" x2="13" y2="12"></line><circle cx="15" cy="14" r="2"></circle>
          </svg>
          <span class="data-val">{{ documento }}</span>
        </div>
      </div>
    </div>

    <!-- Footer Action Buttons -->
    <div class="popup-footer">
      <button class="btn-cancelar-outline" (click)="onCancelar()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        <span>Cancelar</span>
      </button>

      <button class="btn-solid-green" (click)="onDescargar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        <span>Descargar credencial</span>
      </button>
    </div>
  </div>
</div>
