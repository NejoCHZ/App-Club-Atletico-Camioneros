<div class="cacc-layout">
  <!-- Left Sidebar Unificado -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-wrapper">
        <img src="cacc-logo.png" alt="Escudo CACC" class="cacc-shield-img" />
      </div>
      <h2 class="club-title">CLUB ATLETICO SOCIAL Y DEPORTIVO CAMIONEROS</h2>
      <p class="club-subtitle">Sistema de Gestión Integral</p>
    </div>

    <nav class="sidebar-nav">
      <a *ngFor="let item of navItems"
         class="nav-item"
         [class.active]="item.active"
         (click)="selectNav(item)">
        <span class="nav-icon" [ngSwitch]="item.icon">
          <svg *ngSwitchCase="'home'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <svg *ngSwitchCase="'group'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <svg *ngSwitchCase="'badge'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
        </span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a class="logout-btn" (click)="logout()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span>Cerrar Sesión</span>
      </a>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="main-wrapper">
    <header class="top-header">
      <div class="header-left">
        <h1 class="header-title">Visualización de Plantel - {{ categoryName }}</h1>
      </div>

      <div class="header-right">
        <div class="admin-profile">
          <div class="profile-avatar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" /></svg>
          </div>
          <div class="profile-info">
            <span class="profile-name">{{ userName }}</span>
            <span class="profile-email">{{ userEmail }}</span>
          </div>
          <span class="chevron-down">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </span>
        </div>
      </div>
    </header>

    <main class="content-body">

      <!-- Filtros por posición y búsqueda -->
      <div class="filter-bar">
        <span class="filter-label">Filtrar por posición:</span>
        <div class="position-buttons">
          <button class="pos-btn" [class.active]="selectedPosition === 'ARQUERO'" (click)="filterByPosition('ARQUERO')">Arqueros</button>
          <button class="pos-btn" [class.active]="selectedPosition === 'DEFENSOR'" (click)="filterByPosition('DEFENSOR')">Defensores</button>
          <button class="pos-btn" [class.active]="selectedPosition === 'VOLANTE'" (click)="filterByPosition('VOLANTE')">Volantes</button>
          <button class="pos-btn" [class.active]="selectedPosition === 'DELANTERO'" (click)="filterByPosition('DELANTERO')">Delanteros</button>
        </div>

        <div class="search-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2.5" class="search-icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" placeholder="Buscar por nombre" [(ngModel)]="searchTerm" class="search-input" />
        </div>
      </div>

      <!-- Lista de Jugadores -->
      <div class="categories-container">
        <div class="categories-container__header">
          <h3>Lista de Jugadores</h3>
        </div>

        <div class="categories-list">
          <div class="category-row" *ngFor="let p of filteredPlayers">
            <div class="category-info-group">
              <div class="category-accent-bar"></div>
              <div class="category-icon-circle">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M17 21V19C17 17.9391 16.5786 16.9217 15.8284 16.1716C15.0783 15.4214 14.0609 15 13 15H5C3.93913 15 2.92172 15.4214 2.17157 16.1716C1.42143 16.9217 1 17.9391 1 19V21" stroke="#007A3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M9 11C11.2091 11 13 9.20914 13 7C13 4.79086 11.2091 3 9 3C6.79086 3 5 4.79086 5 7C5 9.20914 6.79086 11 9 11Z" stroke="#007A3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </div>
              <span class="category-name">{{ p.name }}</span>
            </div>

            <div class="player-details-grid">
              <span class="detail-item">DNI: {{ p.dni }}</span>
              <span class="detail-item">{{ p.position }}</span>
              <span class="detail-item">{{ p.age }}</span>
            </div>

            <button class="btn-action" (click)="verFicha(p.name)">
              Ver ficha
            </button>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>
