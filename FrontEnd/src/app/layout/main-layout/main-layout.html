<div class="cacc-layout" [class.sidebar-collapsed]="sidebarCollapsed" [class.mobile-sidebar-open]="mobileSidebarOpen" [class.desktop-child-shell]="desktopChildOwnsShell">
  <button *ngIf="mobileSidebarOpen" type="button" class="sidebar-overlay" aria-label="Cerrar menú de navegación" (click)="closeMobileSidebar()"></button>

  <aside id="portal-navigation" class="sidebar" aria-label="Navegación principal">
    <div class="sidebar-header">
      <div class="logo-wrapper"><img src="cacc-logo.png" alt="Escudo CACC" class="cacc-shield-img" /></div>
      <h2 class="club-title">CLUB ATLETICO SOCIAL Y DEPORTIVO CAMIONEROS</h2>
      <p class="club-subtitle">Sistema de Gestión Integral</p>
    </div>

    <nav class="sidebar-nav">
      <a *ngFor="let item of navItems" class="nav-item" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.path === shell.homePath }" (click)="closeMobileSidebar()">
        <span class="nav-icon" [ngSwitch]="item.icon" aria-hidden="true">
          <svg *ngSwitchCase="'home'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <svg *ngSwitchCase="'group'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <svg *ngSwitchCase="'badge'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
          <span *ngSwitchCase="'category'" class="cacc-icon cacc-icon-category" aria-hidden="true"></span>
        </span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a *ngIf="role === 'admin'" class="footer-action-btn portal-btn" routerLink="/admin/portales" title="Volver a Selección de Portales">
        <span class="footer-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 18 9 12 15 6"></polyline></svg></span>
        <span>Selección de Portales</span>
      </a>
      <button type="button" class="footer-action-btn logout-btn" (click)="logout()">
        <span class="footer-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="top-header">
      <div class="mobile-brand" aria-label="Club Atlético Social y Deportivo Camioneros">
        <img src="cacc-logo.png" alt="" aria-hidden="true" />
        <span><strong>CLUB ATLÉTICO SOCIAL Y<br />DEPORTIVO CAMIONEROS</strong><small>SISTEMA DE GESTIÓN INTEGRAL</small></span>
      </div>
      <div class="header-left">
        <button type="button" class="sidebar-toggle-btn" aria-controls="portal-navigation" [attr.aria-expanded]="mobileSidebarOpen || !sidebarCollapsed" aria-label="Ocultar o mostrar menú" (click)="toggleSidebar()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <h1 class="header-title">{{ pageTitle }}</h1>
      </div>

      <div class="header-right">
        <button type="button" class="admin-profile" aria-haspopup="menu" [attr.aria-expanded]="userMenuOpen" (click)="toggleUserMenu($event)">
          <span class="profile-avatar" aria-hidden="true"><span class="cacc-icon cacc-icon-profile"></span></span>
          <span class="profile-info"><span class="profile-name">{{ roleLabel }}</span><span class="profile-email">{{ userIdentifier }}</span></span>
          <span class="chevron-down" [class.rotated]="userMenuOpen" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
        </button>
        <div class="user-dropdown-menu" *ngIf="userMenuOpen" role="menu" (click)="$event.stopPropagation()">
          <button type="button" class="dropdown-item text-danger" role="menuitem" (click)="logout()">
            <span class="dropdown-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span>Cerrar Sesión
          </button>
        </div>
      </div>
    </header>

    <main class="content-body portal-content" tabindex="-1"><router-outlet /></main>

    <nav class="mobile-bottom-nav" aria-label="Navegación móvil">
      <a [routerLink]="shell.homePath" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-7H9v7H3z" /></svg>
        <span>Inicio</span>
      </a>
      <a [routerLink]="['/', role, 'categorias']" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="7" r="3"/><circle cx="5" cy="9" r="2"/><circle cx="19" cy="9" r="2"/><path d="M6 21v-2a6 6 0 0 1 12 0v2M1 21v-2a4 4 0 0 1 4-4m18 6v-2a4 4 0 0 0-4-4"/></svg>
        <span>Categorías</span>
      </a>
      <button type="button" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 4H5v16h5m4-4 4-4-4-4m4 4H9"/></svg>
        <span>Salir</span>
      </button>
    </nav>
  </div>
</div>
