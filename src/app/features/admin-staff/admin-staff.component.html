<div class="cacc-layout">
  <!-- Left Sidebar (Verde Institucional CACC) -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-wrapper">
        <img src="cacc-logo.png" alt="Escudo CACC" class="cacc-shield-img" />
      </div>
      <h2 class="club-title">CLUB ATLETICO SOCIAL Y DEPORTIVO CAMIONEROS</h2>
      <p class="club-subtitle">Sistema de Gestión Integral</p>
    </div>

    <!-- Navigation Menu -->
    <nav class="sidebar-nav">
      <a *ngFor="let item of navItems" 
         class="nav-item" 
         [class.active]="item.active"
         (click)="selectNav(item.label)">
        <span class="nav-icon" [ngSwitch]="item.icon">
          <svg *ngSwitchCase="'home'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <svg *ngSwitchCase="'group'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <svg *ngSwitchCase="'badge'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
        </span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </nav>

    <!-- Logout at Bottom -->
    <div class="sidebar-footer">
      <a class="logout-btn" (click)="volver()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span>Cerrar Sesión</span>
      </a>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="main-wrapper">
    <!-- Header Superior -->
    <header class="top-header">
      <div class="header-left">
        <h1 class="header-title">Panel de Categorias</h1>
      </div>

      <div class="header-right">
        <div class="admin-profile">
          <div class="profile-avatar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
          </div>
          <div class="profile-info">
            <span class="profile-name">Nombre Usuario</span>
            <span class="profile-email">Ejemplo@mialejemplo.com</span>
          </div>
          <span class="chevron-down">❯</span>
        </div>
      </div>
    </header>

    <!-- Main View Body -->
    <main class="content-body">
      <!-- Title -->
      <h1 class="page-title">Staff</h1>

      <!-- Filter Controls Card -->
      <section class="control-card">
        <div class="filter-group">
          <span class="filter-label">Filtrar por rol:</span>

          <!-- Filter Pill: Director Técnico (Silbato) -->
          <button type="button" 
                  class="filter-pill" 
                  [class.active]="rolFiltro === 'DIRECTOR TÉCNICO'" 
                  (click)="toggleRolFiltro('DIRECTOR TÉCNICO')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18 11.5a3.5 3.5 0 1 0-7 0v1.5H4a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h7.1A3.5 3.5 0 1 0 18 11.5zM11 9V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4h-4z"/></svg>
            Director Técnico
          </button>

          <!-- Filter Pill: Preparador Físico (Pesa) -->
          <button type="button" 
                  class="filter-pill" 
                  [class.active]="rolFiltro === 'PREPARADOR FÍSICO'" 
                  (click)="toggleRolFiltro('PREPARADOR FÍSICO')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2 10v4a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1zM18 10v4a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1zM6 12h12M6 8v8M18 8v8"></path></svg>
            Preparador Físico
          </button>
        </div>

        <!-- Search Input -->
        <div class="search-input-wrapper">
          <input type="text" [(ngModel)]="searchTerm" placeholder="Buscar por nombre" class="search-field" />
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#007A3D" stroke-width="2.5" class="search-icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>

        <!-- Action Button -->
        <button type="button" class="btn-alta-trabajador" (click)="darDeAltaTrabajador()">
          <span class="plus-icon">+</span> Dar de alta trabajador
        </button>
      </section>

      <!-- Main Workers List Card Container -->
      <section class="list-container-card">
        <h2 class="list-title">LISTA DE TRABAJADORES</h2>

        <div class="workers-list">
          <div class="worker-row-card" *ngFor="let t of filteredStaff">
            <!-- Avatar -->
            <div class="worker-avatar-wrapper">
              <div class="worker-avatar">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="#007A3D"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
              </div>
            </div>

            <!-- Info Columns -->
            <div class="worker-col col-name">
              <span class="worker-name">{{ t.nombreCompleto }}</span>
            </div>

            <div class="worker-col col-dni">
              <span class="info-label-muted">DNI: {{ t.dni }}</span>
            </div>

            <div class="worker-col col-rol">
              <span class="info-label-muted">{{ t.rol }}</span>
            </div>

            <div class="worker-col col-edad">
              <span class="info-label-muted">{{ t.edad }}</span>
            </div>

            <!-- Action Buttons -->
            <div class="worker-col col-actions">
              <button type="button" class="btn-action-outline" (click)="editarTrabajador(t.id)">Editar Trabajador</button>
              <button type="button" class="btn-action-outline" (click)="verFicha(t.id)">Ver ficha</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
