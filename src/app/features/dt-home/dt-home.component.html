<div class="cacc-layout">
  <!-- Left Sidebar (Verde Institucional CACC) -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <!-- CACC Logo Shield Emblem -->
      <div class="logo-wrapper">
        <img src="cacc-logo.png" alt="Escudo CACC" class="cacc-shield-img" />
      </div>
      <h2 class="club-title">CLUB ATLETICO SOCIAL Y DEPORTIVO CAMIONEROS</h2>
      <p class="club-subtitle">Sistema de Gestión Integral</p>
    </div>

    <!-- Navigation Menu -->
    <nav class="sidebar-nav">
      <a *ngFor="let item of navItems" 
         class="nav-item" 
         [class.active]="item.active"
         (click)="selectNav(item.label)">
        <span class="nav-icon" [ngSwitch]="item.icon">
          <!-- Plantel Icon (2 Users) -->
          <svg *ngSwitchCase="'plantel'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <!-- Estadísticas Icon -->
          <svg *ngSwitchCase="'estadisticas'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          <!-- Configuración Icon -->
          <svg *ngSwitchCase="'configuracion'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </nav>

    <!-- Logout at Bottom -->
    <div class="sidebar-footer">
      <a class="logout-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span>Cerrar Sesión</span>
      </a>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="main-wrapper">
    <!-- Header Superior -->
    <header class="top-header">
      <div class="header-left">
        <button class="hamburger-btn" aria-label="Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <h1 class="header-title">Panel de categorias</h1>
      </div>

      <div class="header-right">
        <div class="admin-profile">
          <div class="profile-avatar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
          </div>
          <div class="profile-info">
            <span class="profile-name">Profesor</span>
            <span class="profile-email">profesor@camioneros.com</span>
          </div>
          <span class="chevron-down">❯</span>
        </div>
      </div>
    </header>

    <!-- Main View Body -->
    <main class="content-body">
      <!-- Section Title -->
      <h1 class="main-page-title">Plantel</h1>

      <!-- Position Filter Bar Card -->
      <section class="filter-card">
        <div class="filter-left">
          <span class="filter-label">Filtrar por posición:</span>
          <div class="position-pills">
            <!-- Arqueros -->
            <button class="position-pill" 
                    [class.active]="posicionFiltro === 'Arqueros'"
                    (click)="setPosicionFiltro('Arqueros')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"></circle><path d="M5.5 21v-2a4 4 0 0 1 4-4h5a4 4 0 0 1 4 4v2"></path></svg>
              <span>Arqueros</span>
            </button>

            <!-- Defensores -->
            <button class="position-pill" 
                    [class.active]="posicionFiltro === 'Defensores'"
                    (click)="setPosicionFiltro('Defensores')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
              <span>Defensores</span>
            </button>

            <!-- Volantes -->
            <button class="position-pill" 
                    [class.active]="posicionFiltro === 'Volantes'"
                    (click)="setPosicionFiltro('Volantes')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><line x1="2" y1="12" x2="22" y2="12"></line></svg>
              <span>Volantes</span>
            </button>

            <!-- Delanteros -->
            <button class="position-pill" 
                    [class.active]="posicionFiltro === 'Delanteros'"
                    (click)="setPosicionFiltro('Delanteros')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"></polyline><line x1="13" y1="19" x2="19" y2="13"></line><line x1="16" y1="16" x2="20" y2="20"></line><line x1="19" y1="21" x2="21" y2="19"></line></svg>
              <span>Delanteros</span>
            </button>
          </div>
        </div>

        <div class="search-box-dt">
          <input type="text" placeholder="Buscar por nombre" [(ngModel)]="searchTerm" class="search-input-dt" />
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#007A3D" stroke-width="2.5" class="search-icon-dt"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
      </section>

      <!-- Player List Card -->
      <section class="players-card">
        <h2 class="players-card-title">LISTA DE JUGADORES</h2>

        <div class="players-list-grid">
          <div class="player-row-card" *ngFor="let p of filteredPlayers">
            <!-- Left Accent Indicator Bar -->
            <div class="player-accent-bar"></div>

            <!-- Avatar -->
            <div class="player-avatar-wrapper">
              <div class="user-avatar-circle-dt">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
              </div>
            </div>

            <!-- Name -->
            <div class="player-col col-name">
              <span class="player-name-text">{{ p.nombreCompleto }}</span>
            </div>

            <!-- DNI -->
            <div class="player-col col-dni-text">
              <span>DNI: {{ p.dni }}</span>
            </div>

            <!-- Posición -->
            <div class="player-col col-posicion-text">
              <span>POSICIÓN</span>
            </div>

            <!-- Edad -->
            <div class="player-col col-edad-text">
              <span>{{ p.edad }}</span>
            </div>

            <!-- Action Button -->
            <div class="player-col col-action">
              <button class="btn-ver-ficha" (click)="verFicha(p)">Ver ficha</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
